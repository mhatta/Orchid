plugins {
    id 'java'
}

// Orchid targets Java 8 bytecode so that it keeps working as a library on
// older JVMs and on Android; it builds and runs on current JDKs (tested with
// JDK 21).  The v3 onion service crypto (SHA3/SHAKE, Ed25519) is implemented
// in pure Java and needs no provider beyond the JDK's AES and SHA-512.
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    // Jars dropped into lib/ take precedence so that the project can be built
    // offline (see lib/README).
    flatDir { dirs 'lib' }
    mavenCentral()
}

dependencies {
    implementation 'commons-io:commons-io:2.18.0'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'com.google.guava:guava:33.4.0-jre'
    implementation 'org.apache.xmlrpc:xmlrpc-common:3.1.3'
    implementation 'org.apache.xmlrpc:xmlrpc-client:3.1.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.easymock:easymock:5.4.0'
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'opt']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:-options'
}

test {
    useJUnit()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'com.subgraph.orchid.TorClient'
    }
}

// gradle clean fatJar
tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Assembles a jar containing Orchid and all of its runtime dependencies.'
    archiveBaseName = rootProject.name
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.subgraph.orchid.TorClient'
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

//https://gist.github.com/JonasGroeger/7620911
def getGitSha() {
    def gitFolder = "$projectDir/.git/"
    def takeFromHash = 12
    try {
        def head = new File(gitFolder + "HEAD").text.split(":") // .git/HEAD
        def isCommit = head.length == 1 // e5a7c79edabbf7dd39888442df081b1c9d8e88fd
        if(isCommit) return head[0].trim().take(takeFromHash) // e5a7c79edabb
        def refHead = new File(gitFolder + head[1].trim()) // .git/refs/heads/master
        return refHead.text.trim().take(takeFromHash)
    } catch(all) {
        return 'unknown'
    }
}

def getReleaseTag() {
    try {
        def proc = ["git", "describe", "--abbrev=0", "--tags"].execute(null, projectDir)
        proc.waitFor()
        def out = proc.in.text.trim()
        return out.isEmpty() ? '0.0.0' : out
    } catch(all) {
        return '0.0.0'
    }
}

version = getReleaseTag()

processResources {
    def fileName = rootProject.name + "-" + version + ".jar"
    def gitSha = getGitSha()
    def releaseDate = new Date().toString()

    filesMatching('application.properties') {
        filter { String line ->
            if(line =~ /^file\.name=/) return "file.name=$fileName"
            if(line =~ /^git\.sha=/) return "git.sha=$gitSha"
            if(line =~ /^release\.date=/) return "release.date=$releaseDate"
            return line
        }
    }
}
