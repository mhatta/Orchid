plugins {
    id 'java'
    id 'maven-publish'
    id 'signing'
}

// Orchid targets Java 8 so that it keeps working as a library on older JVMs
// and on Android; it builds and runs on current JDKs (tested with JDK 21).
// The v3 onion service crypto (SHA3/SHAKE, Ed25519) is implemented in pure
// Java and needs no provider beyond the JDK's AES and SHA-512.
//
// "--release 8" (options.release below) compiles against the Java 8 API, not
// only to Java 8 bytecode, so a call to a method that Java 8 does not have
// is a compile error rather than a NoSuchMethodError at run time.

repositories {
    // Jars dropped into lib/ take precedence so that the project can be built
    // offline (see lib/README.md).
    flatDir { dirs 'lib' }
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java']
        }
        resources {
            srcDirs = ['src/main/resources']
        }
    }
    // The example programs (com.demo).  They are not part of the library,
    // and their dependencies are not dependencies of Orchid.
    demo {
        java {
            srcDirs = ['src/demo/java']
        }
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
    // Orchid as the transport of an Apache XML-RPC client.  Kept out of the
    // library: Apache XML-RPC is unmaintained and its client deserializes
    // Java objects sent by the server (CVE-2019-17570, never fixed).
    xmlrpc {
        java {
            srcDirs = ['src/xmlrpc/java']
        }
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
    test {
        java {
            srcDirs = ['test']
        }
    }
}

configurations {
    demoImplementation.extendsFrom implementation
    demoRuntimeOnly.extendsFrom runtimeOnly
    xmlrpcImplementation.extendsFrom implementation
    xmlrpcRuntimeOnly.extendsFrom runtimeOnly
}

/*
 * The dependencies of these libraries are declared as well, with the
 * versions their POMs ask for.  From Maven Central this changes nothing, but
 * a jar taken from lib/ comes without its POM, and Gradle would not know to
 * put what it needs on the classpath (see lib/README.md).
 */
dependencies {
    xmlrpcImplementation 'org.apache.xmlrpc:xmlrpc-common:3.1.3'
    xmlrpcImplementation 'org.apache.xmlrpc:xmlrpc-client:3.1.3'
    xmlrpcImplementation 'org.apache.ws.commons.util:ws-commons-util:1.0.2'

    demoImplementation 'commons-io:commons-io:2.18.0'
    demoImplementation 'org.jsoup:jsoup:1.18.3'

    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'org.hamcrest:hamcrest-core:1.3'
    testImplementation 'org.easymock:easymock:5.4.0'
    testRuntimeOnly 'org.objenesis:objenesis:3.4'
    testRuntimeOnly 'net.bytebuddy:byte-buddy:1.14.18'
    testRuntimeOnly 'org.ow2.asm:asm:9.7'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:-options'
}

test {
    useJUnit()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

jar {
    manifest {
        attributes 'Main-Class': 'com.subgraph.orchid.TorClient',
                   // A stable name for applications that use Java modules.
                   'Automatic-Module-Name': 'com.subgraph.orchid'
    }
}

// The demo programs: "gradle runDemo" runs OrchidDemo, and demoJar packs
// them into Orchid-<version>-demo.jar.
tasks.register('demoJar', Jar) {
    group = 'build'
    description = 'Assembles a jar of the demo programs (com.demo).'
    archiveBaseName = rootProject.name
    archiveClassifier = 'demo'
    from sourceSets.demo.output
}

tasks.register('runDemo', JavaExec) {
    group = 'application'
    description = 'Runs the OrchidDemo example program.'
    classpath = sourceSets.demo.runtimeClasspath
    mainClass = 'com.demo.OrchidDemo'
}

// Orchid-<version>-xmlrpc.jar: com.subgraph.orchid.xmlrpc, for applications
// that still use Apache XML-RPC.  Built by "gradle xmlrpcJar"; not part of
// "gradle build" or of the fat jar.
tasks.register('xmlrpcJar', Jar) {
    group = 'build'
    description = 'Assembles the optional Apache XML-RPC transport (com.subgraph.orchid.xmlrpc).'
    archiveBaseName = rootProject.name
    archiveClassifier = 'xmlrpc'
    from sourceSets.xmlrpc.output
}

assemble.dependsOn demoJar

// gradle clean fatJar
tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Assembles a jar containing Orchid and all of its runtime dependencies.'
    archiveBaseName = rootProject.name
    archiveClassifier = 'all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.subgraph.orchid.TorClient'
    }
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

/*
 * The version is taken from git and nowhere else.  "git describe" gives the
 * release tag (v2.0.0) for a tagged commit, v2.0.0-3-g1234abcd for the third
 * commit after it, and appends "-dirty" when tracked files have uncommitted
 * changes, so a build that is not a release cannot pass for one.  The
 * version is the tag without its "v": 2.0.0, or 2.0.0-3-g1234abcd.  It names
 * the jars (Orchid-2.0.0.jar) and is written into
 * com/subgraph/orchid/version.properties, which Orchid reports at runtime
 * (ApplicationProperties#getVersion()).
 *
 * Source archives made by git archive, such as the ones GitHub offers for a
 * release, have no .git directory; git fills in .git-archival.txt for them
 * (export-subst in .gitattributes).
 */
def getReleaseTag() {
    try {
        def proc = ["git", "describe", "--tags", "--dirty", "--match", "v[0-9]*"].execute(null, projectDir)
        def out = proc.text.trim()
        proc.waitFor()
        if(proc.exitValue() == 0 && !out.isEmpty()) {
            return out
        }
    } catch(all) {
        // no git; try the archive information below
    }
    def archival = file('.git-archival.txt')
    if(archival.exists()) {
        def m = archival.text =~ /(?m)^describe:\s*(v[0-9]\S*)\s*$/
        if(m.find()) {
            return m.group(1)
        }
    }
    return '0.0.0'
}

group = 'org.mhatta'
version = getReleaseTag().replaceFirst(/^v/, '')

processResources {
    def orchidVersion = version.toString()

    // Declared so that the resource is filtered again when the version
    // changes, for example after a new tag; otherwise Gradle considers the
    // task up to date and keeps the old value.
    inputs.property('orchidVersion', orchidVersion)

    filesMatching('com/subgraph/orchid/version.properties') {
        filter { String line ->
            if(line =~ /^version=/) return "version=$orchidVersion"
            return line
        }
    }
}

// Maven Central requires a javadoc jar: keep the javadoc building, so that
// "gradle build" (and CI) fails on a doclint error rather than the release.
check.dependsOn javadoc

/*
 * Reproducible builds: the same commit built with the same JDK gives
 * byte-for-byte identical jars, whoever builds it and whenever.  Archive
 * entries get fixed timestamps, a fixed order and fixed permissions, and
 * the javadoc carries no generation date.  The class files still depend on
 * the javac version, so compare builds made with the same JDK major
 * version (the release jars are built with JDK 21).
 */
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    dirPermissions { unix('rwxr-xr-x') }
    filePermissions { unix('rw-r--r--') }
}

javadoc {
    options.addBooleanOption('notimestamp', true)
    options.encoding = 'UTF-8'
    // Errors still fail the build; leave out the hundreds of "no comment" warnings.
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

/*
 * Maven Central (https://central.sonatype.com), as org.mhatta:orchid, with
 * Gradle's own maven-publish and signing plugins only.  The Central Portal
 * takes a bundle, a zip of the Maven repository layout with the signatures
 * and checksums:
 *
 *   git checkout v2.4.0
 *   ./gradlew clean centralBundle
 *   tools/central-upload.sh build/distributions/orchid-2.4.0-bundle.zip
 *
 * Signing uses the local gpg (and gpg-agent), with the key named by the
 * Gradle property signing.gnupg.keyName (~/.gradle/gradle.properties), so
 * the private key never leaves the keyring.  See doc/RELEASING.md.
 */
java {
    withSourcesJar()
    withJavadocJar()
}

/*
 * The forks of Orchid published by bitcoinj (org.bitcoinj:orchid) contain
 * the same packages (com.subgraph.orchid).  Declaring their capability
 * makes Gradle refuse a classpath with both, instead of picking classes of
 * one or the other at random.  Maven does not read this; see the README.
 */
['apiElements', 'runtimeElements'].each { name ->
    configurations.named(name) {
        outgoing {
            // Declaring a capability replaces the default one, which
            // project dependencies and composite builds (includeBuild, as in
            // samples/android) ask for; declare it again.
            capability("${project.group}:${project.name}:${project.version}")
            capability("org.mhatta:orchid:${project.version}")
            capability("org.bitcoinj:orchid:${project.version}")
        }
    }
}

def isReleaseVersion = { -> project.version.toString() ==~ /[0-9]+\.[0-9]+\.[0-9]+/ }

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.mhatta'
            artifactId = 'orchid'
            from components.java
            pom {
                name = 'Orchid'
                description = 'A Tor client in pure Java, with v3 onion services; the maintained continuation of Subgraph Orchid.'
                url = 'https://github.com/mhatta/Orchid'
                inceptionYear = '2009'
                licenses {
                    license {
                        name = 'BSD-3-Clause'
                        url = 'https://opensource.org/licenses/BSD-3-Clause'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'mhatta'
                        name = 'Masayuki Hatta'
                        email = 'mhatta@mhatta.org'
                    }
                    developer {
                        name = 'Bruce Leidl'
                        organization = 'Subgraph'
                        organizationUrl = 'https://subgraph.com'
                    }
                }
                scm {
                    url = 'https://github.com/mhatta/Orchid'
                    connection = 'scm:git:https://github.com/mhatta/Orchid.git'
                    developerConnection = 'scm:git:ssh://git@github.com/mhatta/Orchid.git'
                    tag = "v${project.version}"
                }
                issueManagement {
                    system = 'GitHub'
                    url = 'https://github.com/mhatta/Orchid/issues'
                }
            }
        }
    }
    repositories {
        // The bundle for the Central Portal is made from this directory.
        maven {
            name = 'staging'
            url = layout.buildDirectory.dir('staging-deploy')
        }
    }
}

signing {
    useGpgCmd()
    sign publishing.publications.maven
}

def centralRequested = { -> gradle.taskGraph.hasTask(':centralBundle') }

// A bundle for Maven Central only from a release tag with no local changes.
tasks.register('checkReleaseVersion') {
    doLast {
        if(centralRequested() && !isReleaseVersion()) {
            throw new GradleException("Not a release version: ${project.version}.  Check out a release tag (git checkout v<version>) with no local changes.")
        }
    }
}

// Sign only for Maven Central, so that "gradle build" (and publishToMavenLocal) needs no key.
tasks.withType(Sign).configureEach {
    dependsOn 'checkReleaseVersion'
    onlyIf { centralRequested() }
}

tasks.register('cleanStaging', Delete) {
    delete layout.buildDirectory.dir('staging-deploy')
}

tasks.named('publishMavenPublicationToStagingRepository') {
    dependsOn 'cleanStaging', 'checkReleaseVersion'
}

tasks.register('centralBundle', Zip) {
    group = 'publishing'
    description = 'Makes the bundle to upload to the Maven Central Portal (build/distributions/orchid-<version>-bundle.zip).'
    dependsOn 'publishMavenPublicationToStagingRepository'
    archiveFileName = "orchid-${project.version}-bundle.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from layout.buildDirectory.dir('staging-deploy')
    // maven-metadata.xml is not part of a Central deployment.
    exclude '**/maven-metadata.xml*'
}
