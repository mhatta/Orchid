name: Android

# Build the sample app against this checkout, start it on an emulator and
# check that a request through Orchid reaches check.torproject.org from Tor
# (samples/android/app/src/androidTest).  It needs the Tor network, so it
# runs on pushes to master and by hand, not on pull requests.
#
# Actions are pinned to commit SHAs; the comment after each names the release.

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    name: Emulator (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Orchid's minimum, and a current release
          - api-level: 24
            target: default
          - api-level: 35
            target: google_apis

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # build.gradle derives the version from `git describe --tags`
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Hardware acceleration for the emulator
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, install and run the instrumented test
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          working-directory: samples/android
          script: |
            adb logcat -c
            ../../gradlew connectedDebugAndroidTest --no-daemon || (adb logcat -d -s Orchid OrchidSample TestRunner AndroidRuntime > logcat.txt; exit 1)
            adb logcat -d -s Orchid OrchidSample TestRunner > logcat.txt

      - name: Upload logcat and test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-api${{ matrix.api-level }}
          path: |
            samples/android/logcat.txt
            samples/android/app/build/reports/androidTests/
