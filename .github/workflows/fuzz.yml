name: Fuzz

# Fuzz the parsers of what relays, directory caches and onion services send
# (L6 of the security audit) with Jazzer, a coverage-guided fuzzer for the
# JVM.  The targets are the *Fuzzer classes in test/ (see
# test/com/subgraph/orchid/fuzz/FuzzSupport.java); each starts from the
# seeds in test/fuzz/corpus/<target>.  A finding fails the job, and the
# input that caused it is kept as an artifact: put it in the corpus and fix
# the parser.
#
# A short run on every push to master, a longer one every week.
#
# Actions are pinned to commit SHAs; the comment after each names the release.

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '600'

permissions:
  contents: read

env:
  # The last Jazzer release with a standalone binary.  Not JAZZER_*: Jazzer
  # reads every JAZZER_<OPTION> variable as an option, and JAZZER_VERSION
  # stopped it as an invalid value for --version.
  FUZZER_JAZZER_VERSION: 0.24.0
  FUZZER_JAZZER_SHA256: 48ad208580993ba3f1f4347e68c0f17db2db6adcc5553afbbbdfb3fbd4f44ae6

jobs:
  fuzz:
    name: Fuzz ${{ matrix.corpus }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - corpus: consensus
            target: com.subgraph.orchid.fuzz.ConsensusFuzzer
          - corpus: microdescriptor
            target: com.subgraph.orchid.fuzz.MicrodescriptorFuzzer
          - corpus: key-certificate
            target: com.subgraph.orchid.fuzz.KeyCertificateFuzzer
          - corpus: router-descriptor
            target: com.subgraph.orchid.fuzz.RouterDescriptorFuzzer
          - corpus: hs-descriptor
            target: com.subgraph.orchid.circuits.hs.HSV3DescriptorFuzzer
          - corpus: certs-cell
            target: com.subgraph.orchid.connections.CertsCellFuzzer
          - corpus: cell
            target: com.subgraph.orchid.fuzz.CellFuzzer

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # build.gradle derives the version from `git describe --tags`
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          validate-wrappers: true

      - name: Build the targets
        run: ./gradlew testClasses --no-daemon

      - name: Download Jazzer
        run: |
          curl -sSfL -o jazzer.tar.gz \
            "https://github.com/CodeIntelligenceTesting/jazzer/releases/download/v${FUZZER_JAZZER_VERSION}/jazzer-linux.tar.gz"
          echo "${FUZZER_JAZZER_SHA256}  jazzer.tar.gz" | sha256sum -c -
          mkdir jazzer && tar -xzf jazzer.tar.gz -C jazzer

      - name: Fuzz
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || (github.event_name == 'schedule' && '1200') || '120' }}
        run: |
          mkdir -p corpus findings
          cp test/fuzz/corpus/${{ matrix.corpus }}/* corpus/
          jazzer/jazzer \
            --cp=build/classes/java/main:build/resources/main:build/classes/java/test \
            --target_class=${{ matrix.target }} \
            --instrumentation_includes='com.subgraph.**' \
            corpus \
            -- -max_total_time="${SECONDS_PER_TARGET}" -artifact_prefix=findings/

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-findings-${{ matrix.corpus }}
          path: findings/
