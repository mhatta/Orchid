name: CI

# Actions are pinned to commit SHAs, so that a moved tag cannot change what
# runs here.  The comment after each SHA names the release it is.

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '17', '21' ]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # build.gradle derives the version from `git describe --tags`
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          # Check gradle/wrapper/gradle-wrapper.jar against Gradle's published
          # checksums (the default in v4, stated so that it stays on).
          validate-wrappers: true

      - name: Build and run tests
        run: ./gradlew build fatJar --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: build/reports/tests/

      - name: Upload jars
        if: matrix.java == '21'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orchid-jars
          path: build/libs/*.jar

  reproducible:
    name: Reproducible jars
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          # Check gradle/wrapper/gradle-wrapper.jar against Gradle's published
          # checksums (the default in v4, stated so that it stays on).
          validate-wrappers: true

      # Build the same commit twice, in two directories and at two times,
      # and compare the jars byte for byte (see doc/RELEASING.md).
      - name: Build twice and compare
        run: |
          ./gradlew jar sourcesJar javadocJar --no-daemon
          mkdir -p ../first && cp build/libs/*.jar ../first/
          git clone --quiet . ../second
          sleep 2
          (cd ../second && ./gradlew jar sourcesJar javadocJar --no-daemon)
          (cd ../first && sha256sum *.jar) > first.sha256
          (cd ../second/build/libs && sha256sum *.jar) > second.sha256
          cat first.sha256
          diff first.sha256 second.sha256
